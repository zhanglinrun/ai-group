spring:
  application:
    name: gateway-service
  main:
    web-application-type: reactive
  cloud:
    compatibility-verifier:
      enabled: false
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848}
        namespace: public
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 10000
            response-timeout: 300000
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:16379}
      password: ${REDIS_PASSWORD:}
      database: 0
  http:
    codecs:
      max-in-memory-size: 32MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

sa-token:
  token-name: satoken
  timeout: ${SA_TOKEN_TIMEOUT:2592000}
  active-timeout: ${SA_TOKEN_ACTIVE_TIMEOUT:1800}
  is-concurrent: false
  is-share: false
  is-read-header: true
  is-read-cookie: true
  is-write-header: false
  cookie:
    secure: ${SA_TOKEN_COOKIE_SECURE:false}
  dao:
    type: cn.dev33.satoken.dao.SaTokenDaoRedisJackson

gateway:
  route:
    # 平台服务与 agent 经 Nacos 服务发现 + 负载均衡（lb://服务名）；local profile 覆盖为直连
    auth-uri: lb://auth-service
    member-uri: lb://member-service
    bff-uri: lb://bff-service
    pay-uri: lb://pay-service
    group-uri: lb://group-service

ai-group:
  internal:
    token: ${AI_GROUP_INTERNAL_TOKEN:}
  identity:
    signing-secret: ${AI_GROUP_IDENTITY_SIGNING_SECRET:}

logging:
  level:
    com.aigroup.gateway: info

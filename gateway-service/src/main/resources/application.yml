spring:
  application:
    name: gateway
  main:
    web-application-type: reactive
  cloud:
    compatibility-verifier:
      enabled: false
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848}
        namespace: public
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 10000
            response-timeout: 300000
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:16379}
      database: 0
  http:
    codecs:
      max-in-memory-size: 32MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

jwt:
  secret: ${JWT_SECRET:change-me-to-a-long-random-secret}

gateway:
  route:
    # 平台服务与 agent 经 Nacos 服务发现 + 负载均衡（lb://服务名）；local profile 覆盖为直连
    auth-uri: lb://auth
    member-uri: lb://member
    bff-uri: lb://bff
    agent-uri: lb://agent
    # group/pay 为独立集成业务系统（未注册 Nacos），经配置端点转发
    pay-uri: http://127.0.0.1:8070
    group-uri: http://127.0.0.1:8091

ai-group:
  internal:
    token: ${AI_GROUP_INTERNAL_TOKEN:change-me-to-a-long-random-internal-token}

logging:
  level:
    com.aigroup.gateway: info

# local profile: skip Nacos; all routes use fixed localhost ports
spring:
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
    sentinel:
      enabled: false

gateway:
  route:
    auth-uri: http://127.0.0.1:8081
    member-uri: http://127.0.0.1:18082
    pay-uri: http://127.0.0.1:8070
    group-uri: http://127.0.0.1:8091
    agent-uri: http://127.0.0.1:8090

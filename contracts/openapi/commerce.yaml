openapi: 3.1.0
info:
  title: 熊博士拼团与支付服务
  version: 1.0.0
servers:
  - url: /api
paths:
  /group/activities:
    get:
      operationId: listActivities
      responses: {'200': {description: 拼团活动}}
  /group/activities/{activityId}/join:
    post:
      operationId: joinActivity
      parameters:
        - name: activityId
          in: path
          required: true
          schema: {type: integer, format: int64}
      responses: {'200': {description: 已创建订单}}
  /pay/orders:
    post:
      operationId: createPayOrder
      responses: {'200': {description: 支付订单}}
  /pay/orders/{orderId}:
    get:
      operationId: getPayOrder
      parameters:
        - name: orderId
          in: path
          required: true
          schema: {type: string}
      responses: {'200': {description: 订单}}
  /pay/orders/{orderId}/cancel:
    post:
      operationId: cancelPayOrder
      parameters:
        - name: orderId
          in: path
          required: true
          schema: {type: string}
      responses: {'200': {description: 订单已取消}}

openapi: 3.1.0
info:
  title: 熊博士积分服务
  version: 1.0.0
servers:
  - url: /api/member
paths:
  /quota/{userId}:
    get:
      operationId: getQuota
      parameters:
        - name: userId
          in: path
          required: true
          schema: {type: integer, format: int64}
      responses:
        '200':
          description: 当前积分账户
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QuotaAccountResponse'}
  /quota-ledger:
    get:
      operationId: getLedger
      responses:
        '200':
          description: 积分流水
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/LedgerEntry'}
  /internal/member/quota/reservations:
    post:
      operationId: reserveQuota
      security: [{internalToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReserveQuotaRequest'}
      responses:
        '200':
          description: 冻结结果
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Reservation'}
  /internal/member/quota/reservations/{reservationId}/confirm:
    post:
      operationId: confirmQuota
      security: [{internalToken: []}]
      parameters:
        - {$ref: '#/components/parameters/reservationId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConfirmQuotaRequest'}
      responses:
        '200': {description: 已确认}
  /internal/member/quota/reservations/{reservationId}/release:
    post:
      operationId: releaseQuota
      security: [{internalToken: []}]
      parameters:
        - {$ref: '#/components/parameters/reservationId'}
      responses:
        '200': {description: 已释放}
components:
  parameters:
    reservationId:
      name: reservationId
      in: path
      required: true
      schema: {type: string}
  securitySchemes:
    internalToken:
      type: apiKey
      in: header
      name: X-Internal-Token
  schemas:
    QuotaAccountResponse:
      type: object
      required: [userId, availableQuota, frozenBalance]
      properties:
        userId: {type: integer, format: int64}
        freeQuotaBalance: {type: integer, format: int64}
        paidQuotaBalance: {type: integer, format: int64}
        frozenBalance: {type: integer, format: int64}
        availableQuota: {type: integer, format: int64}
    LedgerEntry:
      type: object
      properties:
        id: {type: integer, format: int64}
        type: {type: string}
        deltaMicroPoints: {type: integer, format: int64}
        businessKey: {type: string}
        createdAt: {type: string, format: date-time}
    ReserveQuotaRequest:
      type: object
      required: [userId, amount, requestId, ownerService]
      properties:
        userId: {type: integer, format: int64}
        amount: {type: integer, format: int64, minimum: 1}
        minAmount: {type: integer, format: int64, minimum: 1}
        abilityCode: {type: string}
        requestId: {type: string, minLength: 1, maxLength: 128}
        ownerService: {type: string, enum: [agent-service]}
        traceId: {type: string}
    ConfirmQuotaRequest:
      type: object
      required: [actualAmount]
      properties:
        actualAmount: {type: integer, format: int64, minimum: 0}
    Reservation:
      type: object
      required: [freezeId, amount, status]
      properties:
        freezeId: {type: string}
        amount: {type: integer, format: int64}
        settledAmount: {type: integer, format: int64, nullable: true}
        status: {type: string, enum: [PENDING, CONFIRMED, RELEASED]}

openapi: 3.1.0
info:
  title: 熊博士认证服务
  version: 1.0.0
servers:
  - url: /api/auth
tags:
  - name: auth
paths:
  /register:
    post:
      operationId: register
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterRequest'}
      responses:
        '200':
          description: 注册成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiResponseUser'}
  /login:
    post:
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: 登录成功，服务端设置 HttpOnly 会话 Cookie
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiResponseLogin'}
  /logout:
    post:
      operationId: logout
      tags: [auth]
      responses:
        '200': {description: 已退出}
  /me:
    get:
      operationId: currentUser
      tags: [auth]
      security: [{saToken: []}]
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiResponseUser'}
  /refresh:
    post:
      operationId: refresh
      tags: [auth]
      responses:
        '200': {description: 会话已刷新}
components:
  securitySchemes:
    saToken:
      type: apiKey
      in: cookie
      name: satoken
  schemas:
    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username: {type: string, minLength: 3, maxLength: 64}
        password: {type: string, minLength: 8, maxLength: 128, format: password}
        email: {type: string, format: email}
        phone: {type: string, maxLength: 32}
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: {type: string, minLength: 3, maxLength: 64}
        password: {type: string, minLength: 1, maxLength: 128, format: password}
    User:
      type: object
      required: [id, username, role]
      properties:
        id: {type: integer, format: int64}
        username: {type: string}
        role: {type: string, enum: [USER, ADMIN]}
        email: {type: string, nullable: true}
    Login:
      type: object
      required: [user]
      properties:
        user: {$ref: '#/components/schemas/User'}
        authenticated: {type: boolean}
    ApiResponseUser:
      type: object
      properties:
        code: {type: integer}
        message: {type: string}
        data: {$ref: '#/components/schemas/User'}
    ApiResponseLogin:
      type: object
      properties:
        code: {type: integer}
        message: {type: string}
        data: {$ref: '#/components/schemas/Login'}

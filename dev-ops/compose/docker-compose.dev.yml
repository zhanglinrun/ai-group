name: xiongdoctor-dev

services:
  mysql:
    image: mysql:8.4
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-xiongdoctor_dev}
    ports: ["${MYSQL_PUBLISH_PORT:-13306}:3306"]
    volumes:
      - dev_mysql_data:/var/lib/mysql
      - ../mysql/init/00-databases.sql:/docker-entrypoint-initdb.d/00-databases.sql:ro
      - ../../auth-service/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/10-auth.sql:ro
      - ../../member-service/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/11-member.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysql -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7.4-alpine
    ports: ["${REDIS_PUBLISH_PORT:-16379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
  kafka:
    image: apache/kafka:3.8.1
    hostname: kafka
    ports:
      - "${KAFKA_PUBLISH_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:19092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
  agent-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${AGENT_POSTGRES_DB:-xiongdoctor_agent}
      POSTGRES_USER: ${AGENT_POSTGRES_USER:-xiongdoctor}
      POSTGRES_PASSWORD: ${AGENT_POSTGRES_PASSWORD:-xiongdoctor_dev}
    ports: ["${AGENT_POSTGRES_PUBLISH_PORT:-15432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]

  xxl-job-mysql:
    image: mysql:8.0
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_DATABASE: xxl_job
      MYSQL_USER: ${XXL_JOB_MYSQL_USER:-xxl_job}
      MYSQL_PASSWORD: ${XXL_JOB_MYSQL_PASSWORD:-xxl_job_dev}
      MYSQL_ROOT_PASSWORD: ${XXL_JOB_MYSQL_ROOT_PASSWORD:-xxl_job_root_dev}
      TZ: Asia/Shanghai
    volumes:
      - dev_xxl_job_mysql_data:/var/lib/mysql
      - ../xxl-job/tables_xxl_job.sql:/docker-entrypoint-initdb.d/01-tables_xxl_job.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20

  xxl-job-admin:
    image: xuxueli/xxl-job-admin:3.4.2
    environment:
      TZ: Asia/Shanghai
      PARAMS: >-
        --spring.datasource.url=jdbc:mysql://xxl-job-mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
        --spring.datasource.username=${XXL_JOB_MYSQL_USER:-xxl_job}
        --spring.datasource.password=${XXL_JOB_MYSQL_PASSWORD:-xxl_job_dev}
        --xxl.job.accessToken=${XXL_JOB_ACCESS_TOKEN:-default_token}
    ports:
      - "${XXL_JOB_ADMIN_PUBLISH_PORT:-18081}:8080"
    volumes:
      - dev_xxl_job_admin_logs:/data/applogs
    depends_on:
      xxl-job-mysql: {condition: service_healthy}
    restart: unless-stopped

  agent-service:
    build:
      context: ../../agent-service
      dockerfile: app/Dockerfile
    env_file:
      - ../../.env
    environment:
      APP_PORT: 8090
      POSTGRES_HOST: agent-postgres
      POSTGRES_PORT: 5432
    expose: ["8090"]
    depends_on:
      agent-postgres: {condition: service_healthy}
  frontend:
    image: node:20-alpine
    working_dir: /workspace
    command: ["sh", "-c", "npm ci --ignore-scripts && npm run dev -- --host 0.0.0.0"]
    volumes:
      - ../../frontend:/workspace
      - dev_web_node_modules:/workspace/node_modules
    ports: ["${WEB_PUBLISH_PORT:-5173}:5173"]

volumes:
  dev_mysql_data:
  dev_web_node_modules:
  dev_xxl_job_mysql_data:
  dev_xxl_job_admin_logs:

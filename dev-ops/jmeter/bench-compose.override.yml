# Use only with -p ai-group-bench; verify ownership before reusing its test volumes.
# Bench-only tuning: do not copy these into daily Compose / production defaults.
networks:
  default:
    name: ai-group-bench_default

services:
  mysql:
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
      - "--max_connections=300"
  group-service:
    environment:
      # The local MySQL 8.4 container uses caching_sha2_password without TLS.
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/group_buy_market?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
      AI_GROUP_KAFKA_TOPIC_PARTITIONS: "16"
  pay-service:
    environment:
      ALIPAY_ENABLED: "false"
      SPRING_KAFKA_LISTENER_CONCURRENCY: "16"
      SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET: "latest"
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "40"
      THREAD_POOL_EXECUTOR_CONFIG_CORE_POOL_SIZE: "32"
      THREAD_POOL_EXECUTOR_CONFIG_MAX_POOL_SIZE: "64"
      # Avoid CallerRuns blocking Kafka listener threads on outbox publish ACK.
      THREAD_POOL_EXECUTOR_CONFIG_POLICY: "AbortPolicy"
      AI_GROUP_KAFKA_TOPIC_PARTITIONS: "16"
  member-service:
    environment:
      SPRING_KAFKA_LISTENER_CONCURRENCY: "16"
      SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET: "latest"
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "40"
      AI_GROUP_KAFKA_TOPIC_PARTITIONS: "16"

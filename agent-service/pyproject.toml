[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "xiongdoctor-agent-service"
version = "1.0.0"
description = "熊博士 LangGraph agent and token metering service"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools]
package-dir = {"" = "app"}

[tool.setuptools.packages.find]
where = ["app"]

[tool.setuptools.dynamic]
dependencies = {file = ["app/requirements.txt"]}

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "PLR"]
ignore = ["PLR0913"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["app"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

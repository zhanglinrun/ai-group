# Derived from Spring AI Alibaba Admin v1.1.2.2's OTLP pipeline.
# The Elasticsearch sink is intentionally omitted for the P00 isolated startup test.
enable: true
inputs:
  - Type: service_otlp
    Protocals:
      HTTP:
        Endpoint: 0.0.0.0:4318
        MaxRecvMsgSizeMiB: 64
        ReadTimeoutSec: 10
        ShutdownTimeoutSec: 5
flushers:
  - Type: flusher_stdout
    OnlyStdout: true
    Tags: true

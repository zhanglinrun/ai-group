spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:13306}/auth_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_ROOT_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:16379}
      password: ${REDIS_PASSWORD:}
      database: 0
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:xiongdoctor}
    password: ${RABBITMQ_PASSWORD:xiongdoctor_dev}
    publisher-confirm-type: correlated
    publisher-returns: true
    event-exchange: ${RABBITMQ_EVENT_EXCHANGE:xiongdoctor.events}
    confirm-timeout-ms: ${RABBITMQ_CONFIRM_TIMEOUT_MS:5000}
    outbox-dispatch-ms: ${AUTH_OUTBOX_DISPATCH_MS:1000}
  cloud:
    compatibility-verifier:
      enabled: false
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized

jwt:
  secret: ${JWT_SECRET:}

sa-token:
  token-name: satoken
  timeout: ${SA_TOKEN_TIMEOUT:2592000}
  active-timeout: ${SA_TOKEN_ACTIVE_TIMEOUT:1800}
  is-concurrent: false
  is-share: false
  is-read-header: true
  is-read-cookie: true
  is-write-header: false
  cookie:
    secure: ${SA_TOKEN_COOKIE_SECURE:false}
  dao:
    type: cn.dev33.satoken.dao.SaTokenDaoRedisJackson

ai-group:
  internal:
    token: ${AI_GROUP_INTERNAL_TOKEN:}

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:13306}/auth_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_ROOT_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:16379}
      password: ${REDIS_PASSWORD:}
      database: 0
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual
  cloud:
    compatibility-verifier:
      enabled: false
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized

sa-token:
  token-name: satoken
  timeout: ${SA_TOKEN_TIMEOUT:2592000}
  active-timeout: ${SA_TOKEN_ACTIVE_TIMEOUT:1800}
  is-concurrent: false
  is-share: false
  is-read-header: true
  is-read-cookie: true
  is-write-header: false
  cookie:
    secure: ${SA_TOKEN_COOKIE_SECURE:false}
  dao:
    type: cn.dev33.satoken.dao.SaTokenDaoRedisJackson

ai-group:
  internal:
    token: ${AI_GROUP_INTERNAL_TOKEN:}
  identity:
    signing-secret: ${AI_GROUP_IDENTITY_SIGNING_SECRET:}
  kafka:
    ack-timeout-ms: ${KAFKA_ACK_TIMEOUT_MS:5000}
    topics:
      user-registered: ${KAFKA_USER_REGISTERED:auth.user_registered}

auth:
  outbox:
    local-scheduler-enabled: ${AUTH_OUTBOX_LOCAL_SCHEDULER_ENABLED:false}
    dispatch-ms: ${AUTH_OUTBOX_DISPATCH_MS:1000}

xxl:
  job:
    enabled: ${XXL_JOB_ENABLED:true}
    admin:
      addresses: ${XXL_JOB_ADMIN_ADDRESSES:http://127.0.0.1:18081/xxl-job-admin}
    accessToken: ${XXL_JOB_ACCESS_TOKEN:default_token}
    executor:
      appname: auth
      port: 9996
      logpath: ${XXL_JOB_LOGPATH:./logs/xxl-job/auth}
      logretentiondays: 30

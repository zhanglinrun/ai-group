# Optional observability / ops stack for local full-stack.
# Used together with docker-compose-platform.yml:
#   docker compose -f docker-compose-platform.yml -f docker-compose-observability.yml up -d
services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: ai-group-prometheus
    restart: unless-stopped
    ports:
      - "19090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: ai-group-grafana
    restart: unless-stopped
    ports:
      - "13000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: ai-group-elasticsearch
    restart: unless-stopped
    ports:
      - "19200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.3
    container_name: ai-group-logstash
    restart: unless-stopped
    ports:
      - "15044:15044"
    environment:
      LS_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - ./observability/logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    depends_on:
      - elasticsearch

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    container_name: ai-group-kibana
    restart: unless-stopped
    ports:
      - "15601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on:
      - elasticsearch

  nginx:
    image: nginx:1.27-alpine
    container_name: ai-group-nginx
    restart: unless-stopped
    ports:
      - "18080:80"
    volumes:
      - ./observability/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  pgvector:
    image: pgvector/pgvector:pg16
    container_name: ai-group-pgvector
    restart: unless-stopped
    ports:
      - "15432:5432"
    environment:
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: agent_vector
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  xxl-job-admin:
    image: xuxueli/xxl-job-admin:3.4.2
    container_name: ai-group-xxl-job-admin
    restart: unless-stopped
    ports:
      - "18081:8080"
    environment:
      PARAMS: >-
        --spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
        --spring.datasource.username=root
        --spring.datasource.password=123456
    depends_on:
      mysql:
        condition: service_healthy

  phpmyadmin:
    image: phpmyadmin:5.2.1
    container_name: ai-group-phpmyadmin
    restart: unless-stopped
    ports:
      - "8899:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: "123456"
    depends_on:
      mysql:
        condition: service_healthy

  redis-admin:
    image: spryker/redis-commander:0.8.0
    container_name: ai-group-redis-admin
    restart: unless-stopped
    ports:
      - "16381:8081"
    environment:
      REDIS_HOSTS: local:redis:6379
      HTTP_USER: admin
      HTTP_PASSWORD: admin
    depends_on:
      redis:
        condition: service_started

volumes:
  prometheus_data:
  grafana_data:
  elasticsearch_data:
  pgvector_data:

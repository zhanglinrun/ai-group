# Optional observability / ops stack for local full-stack.
# Used together with docker-compose-platform.yml:
#   docker compose -f docker-compose-platform.yml -f docker-compose-observability.yml up -d
services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: ai-group-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:19090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: ai-group-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:13000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: ai-group-elasticsearch
    restart: unless-stopped
    ports:
      - "127.0.0.1:19200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.3
    container_name: ai-group-logstash
    restart: unless-stopped
    ports:
      - "127.0.0.1:15044:15044"
    environment:
      LS_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - ./observability/logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    depends_on:
      - elasticsearch

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    container_name: ai-group-kibana
    restart: unless-stopped
    ports:
      - "127.0.0.1:15601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on:
      - elasticsearch

  nginx:
    image: nginx:1.27-alpine
    container_name: ai-group-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:80"
    volumes:
      - ./observability/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  phpmyadmin:
    image: phpmyadmin:5.2.1
    container_name: ai-group-phpmyadmin
    restart: unless-stopped
    ports:
      - "127.0.0.1:8899:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy

  redis-admin:
    image: spryker/redis-commander:0.8.0
    container_name: ai-group-redis-admin
    restart: unless-stopped
    ports:
      - "127.0.0.1:16381:8081"
    environment:
      REDIS_HOSTS: local:redis:6379:0:${REDIS_PASSWORD:?set REDIS_PASSWORD}
      HTTP_USER: admin
      HTTP_PASSWORD: ${REDIS_ADMIN_PASSWORD:?set REDIS_ADMIN_PASSWORD}
    depends_on:
      redis:
        condition: service_started

volumes:
  prometheus_data:
  grafana_data:
  elasticsearch_data:

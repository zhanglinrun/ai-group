# Optional observability / ops stack for local full-stack.
# Used together with docker-compose-platform.yml:
#   docker compose -f docker-compose-platform.yml -f docker-compose-observability.yml up -d
services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: ai-group-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:19090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: ai-group-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:13000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: ai-group-elasticsearch
    restart: unless-stopped
    ports:
      - "127.0.0.1:19200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.3
    container_name: ai-group-logstash
    restart: unless-stopped
    ports:
      - "127.0.0.1:15044:15044"
    environment:
      LS_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - ./observability/logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    depends_on:
      - elasticsearch

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    container_name: ai-group-kibana
    restart: unless-stopped
    ports:
      - "127.0.0.1:15601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on:
      - elasticsearch

  nginx:
    image: nginx:1.27-alpine
    container_name: ai-group-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:80"
    volumes:
      - ./observability/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  phpmyadmin:
    image: phpmyadmin:5.2.1
    container_name: ai-group-phpmyadmin
    restart: unless-stopped
    ports:
      - "127.0.0.1:8899:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy

  redis-admin:
    image: spryker/redis-commander:0.8.0
    container_name: ai-group-redis-admin
    restart: unless-stopped
    ports:
      - "127.0.0.1:16381:8081"
    environment:
      REDIS_HOSTS: local:redis:6379:0:${REDIS_PASSWORD:?set REDIS_PASSWORD}
      HTTP_USER: admin
      HTTP_PASSWORD: ${REDIS_ADMIN_PASSWORD:?set REDIS_ADMIN_PASSWORD}
    depends_on:
      redis:
        condition: service_started

  # P110: Admin remains a visual/OTLP consumer. MySQL Execution Ledger is not replaced.
  saa-admin-schema-init:
    build:
      context: ./saa-admin
      target: schema
      args:
        SAA_ADMIN_SOURCE_REF: c8a9c3ed40e0d9d626341921d5d7a76080cf699c
    image: ai-group/saa-admin-schema:c8a9c3e
    container_name: ai-group-saa-admin-schema-init
    restart: "no"
    environment:
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - >-
        mysql -h mysql -uroot -e 'CREATE DATABASE IF NOT EXISTS saa_admin
        CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci';
        mysql -h mysql -uroot saa_admin < /schema/admin-schema.sql

  saa-admin-collector:
    image: sls-opensource-registry.cn-shanghai.cr.aliyuncs.com/loongcollector-community-edition/loongcollector:3.1.4
    container_name: ai-group-saa-admin-collector
    restart: unless-stopped
    ports:
      - "127.0.0.1:14318:4318"
    volumes:
      - ./observability/saa-admin/otlp_pipeline.yaml:/usr/local/loongcollector/conf/continuous_pipeline_config/local/otlp_pipeline.yaml:ro
    depends_on:
      elasticsearch:
        condition: service_started

  # P110: the pinned Admin source creates a RocketMQ document-index producer at
  # startup. Keep this dependency isolated from the platform Kafka deployment.
  saa-admin-rmq-namesrv:
    image: apache/rocketmq:5.3.2
    container_name: ai-group-saa-admin-rmq-namesrv
    restart: unless-stopped
    environment:
      NAMESRV_ADDR: saa-admin-rmq-namesrv:9876
      HEAP_OPTS: -Xms128M -Xmx256M -Xmn128M
    command: sh mqnamesrv
    healthcheck:
      test: ["CMD", "sh", "-c", "ps aux | grep mqnamesrv | grep -v grep || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  saa-admin-rmq-storage-init:
    image: apache/rocketmq:5.3.2
    container_name: ai-group-saa-admin-rmq-storage-init
    restart: "no"
    user: "0:0"
    volumes:
      - saa_admin_rocketmq_data:/home/rocketmq/store
    command:
      - sh
      - -ec
      - mkdir -p /home/rocketmq/store && chown -R 3000:3000 /home/rocketmq/store

  saa-admin-rmq-broker:
    image: apache/rocketmq:5.3.2
    container_name: ai-group-saa-admin-rmq-broker
    restart: unless-stopped
    environment:
      NAMESRV_ADDR: saa-admin-rmq-namesrv:9876
      HEAP_OPTS: -Xms256M -Xmx512M -Xmn256M -XX:MaxDirectMemorySize=128M
    volumes:
      - saa_admin_rocketmq_data:/home/rocketmq/store
    command: sh mqbroker
    depends_on:
      saa-admin-rmq-namesrv:
        condition: service_healthy
      saa-admin-rmq-storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "sh", "-c", "ps aux | grep mqbroker | grep -v grep || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  saa-admin-rmq-proxy:
    image: apache/rocketmq:5.3.2
    container_name: ai-group-saa-admin-rmq-proxy
    restart: unless-stopped
    environment:
      NAMESRV_ADDR: saa-admin-rmq-namesrv:9876
      HEAP_OPTS: -Xms128M -Xmx256M -Xmn128M
    volumes:
      - ./observability/saa-admin/rmq-proxy.json:/home/rocketmq/conf/rmq-proxy.json:ro
    command: sh mqproxy -pc /home/rocketmq/conf/rmq-proxy.json
    depends_on:
      saa-admin-rmq-broker:
        condition: service_healthy

  # The Admin document-index producer must find its topic and consumer group at
  # startup. Create them deterministically after the isolated broker is healthy.
  saa-admin-rmq-topic-init:
    image: apache/rocketmq:5.3.2
    container_name: ai-group-saa-admin-rmq-topic-init
    restart: "no"
    environment:
      NAMESRV_ADDR: saa-admin-rmq-namesrv:9876
    entrypoint:
      - /bin/sh
      - -ec
      - >-
        /home/rocketmq/rocketmq-5.3.2/bin/mqadmin updateTopic -n saa-admin-rmq-namesrv:9876
        -t topic_saa_studio_document_index -c DefaultCluster -a +message.type=NORMAL;
        /home/rocketmq/rocketmq-5.3.2/bin/mqadmin updateSubGroup -n saa-admin-rmq-namesrv:9876
        -g group_saa_studio_document_index -c DefaultCluster
    depends_on:
      saa-admin-rmq-broker:
        condition: service_healthy

  saa-admin:
    build:
      context: ./saa-admin
      target: runtime
      args:
        SAA_ADMIN_SOURCE_REF: c8a9c3ed40e0d9d626341921d5d7a76080cf699c
    image: ai-group/saa-admin:c8a9c3e
    container_name: ai-group-saa-admin
    restart: unless-stopped
    ports:
      - "127.0.0.1:18090:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/saa_admin?useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&allowMultiQueries=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      # The pinned Admin source binds Redisson directly from spring.data.redis.password.
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      NACOS_SERVER_ADDR: nacos:8848
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
      # The pinned Admin source also has a custom client bound from this key.
      SPRING_ELASTICSEARCH_URL: http://elasticsearch:9200
      ROCKETMQ_ENDPOINTS: saa-admin-rmq-proxy:18080
      ROCKETMQ_DOCUMENT_INDEX_TOPIC: topic_saa_studio_document_index
      ROCKETMQ_DOCUMENT_INDEX_GROUP: group_saa_studio_document_index
      MANAGEMENT_OTLP_TRACING_EXPORT_ENDPOINT: http://saa-admin-collector:4318/v1/traces
      SPRING_AI_CHAT_OBSERVATIONS_LOG_PROMPT: "false"
      SPRING_AI_CHAT_OBSERVATIONS_LOG_COMPLETION: "false"
      SPRING_AI_ALIBABA_ARMS_MODEL_CAPTURE_INPUT: "false"
      SPRING_AI_ALIBABA_ARMS_MODEL_CAPTURE_OUTPUT: "false"
    depends_on:
      saa-admin-schema-init:
        condition: service_completed_successfully
      saa-admin-collector:
        condition: service_started
      saa-admin-rmq-proxy:
        condition: service_started
      saa-admin-rmq-topic-init:
        condition: service_completed_successfully

volumes:
  prometheus_data:
  grafana_data:
  elasticsearch_data:
  saa_admin_rocketmq_data:

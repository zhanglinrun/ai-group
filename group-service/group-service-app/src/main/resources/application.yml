spring:
  application:
    name: group-service
  profiles:
    active: dev
  cloud:
    compatibility-verifier:
      enabled: false
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848}
        namespace: ${NACOS_NAMESPACE:public}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual

ai-group:
  identity:
    signing-secret: ${AI_GROUP_IDENTITY_SIGNING_SECRET:}
  kafka:
    ack-timeout-ms: ${KAFKA_ACK_TIMEOUT_MS:5000}
    topics:
      team-success: ${KAFKA_GROUP_TEAM_SUCCESS:group.team_success}
      team-refund: ${KAFKA_GROUP_TEAM_REFUND:group.team_refund}

group:
  outbox:
    # Prefer XXL-JOB groupBuyNotifyJob when Admin is available. Set true only
    # as a fallback when XXL_JOB_ENABLED=false.
    local-scheduler-enabled: ${GROUP_OUTBOX_LOCAL_SCHEDULER_ENABLED:false}
    publish-interval-ms: ${GROUP_OUTBOX_PUBLISH_INTERVAL_MS:60000}
    publish-initial-delay-ms: ${GROUP_OUTBOX_PUBLISH_INITIAL_DELAY_MS:60000}

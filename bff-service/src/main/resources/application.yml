spring:
  application:
    name: bff
  cloud:
    compatibility-verifier:
      enabled: false
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848}

server:
  port: 8083

# bff 不校验 JWT（信任网关注入的身份头），但 common 模块的 JwtUtils 被扫描实例化，
# 其 @PostConstruct 要求 secret 非空；提供 dev 默认值以便本服务可独立启动。
jwt:
  secret: ${JWT_SECRET:ai-group-dev-jwt-secret-2026-k8m3p9x2v7n4q1w6-change-in-prod}

ai-group:
  # member.url 留空：默认走 Nacos 服务发现调用 member；local profile 覆盖为直连。
  # group/pay 未注册 Nacos，仍按配置端点直连。
  group:
    url: http://127.0.0.1:8091
  pay:
    url: http://127.0.0.1:8070
  internal:
    token: ${AI_GROUP_INTERNAL_TOKEN:ai-group-dev-internal-token-change-in-prod}

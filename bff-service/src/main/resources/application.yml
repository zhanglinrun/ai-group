spring:
  application:
    name: bff
  cloud:
    compatibility-verifier:
      enabled: false
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized

jwt:
  secret: ${JWT_SECRET:}

ai-group:
  # 下游 URL 默认留空并走 Nacos；local profile 覆盖为固定端口直连。
  internal:
    token: ${AI_GROUP_INTERNAL_TOKEN:}

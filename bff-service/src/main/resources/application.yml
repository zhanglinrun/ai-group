spring:
  application:
    name: bff-service
  # Evidence pages return the complete, sanitized evidence list in one
  # response.  A quick run can easily exceed WebClient's 256 KiB default
  # in-memory limit, which previously made the BFF return an empty object even
  # though the Agent and database still contained every evidence row.
  codec:
    max-in-memory-size: 16MB
  cloud:
    compatibility-verifier:
      enabled: false
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized

ai-group:
  # 下游 URL 默认留空并走 Nacos；local profile 覆盖为固定端口直连。
  internal:
    token: ${AI_GROUP_INTERNAL_TOKEN:}
  identity:
    signing-secret: ${AI_GROUP_IDENTITY_SIGNING_SECRET:}
  agent:
    url: ${AGENT_SERVICE_URL:}
    connect-timeout-ms: ${AGENT_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${AGENT_READ_TIMEOUT_MS:45000}
    write-timeout-ms: ${AGENT_WRITE_TIMEOUT_MS:10000}

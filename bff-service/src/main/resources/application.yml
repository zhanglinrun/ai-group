spring:
  application:
    name: bff
  cloud:
    compatibility-verifier:
      enabled: false
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}

server:
  port: 8083

# bff 不校验 JWT（信任网关注入的身份头），但 common 模块的 JwtUtils 被扫描实例化，
# 其 @PostConstruct 要求 secret 非空；提供 dev 默认值以便本服务可独立启动。
jwt:
  secret: ${JWT_SECRET:}

ai-group:
  # 下游 URL 默认留空并走 Nacos；local profile 覆盖为固定端口直连。
  internal:
    token: ${AI_GROUP_INTERNAL_TOKEN:}

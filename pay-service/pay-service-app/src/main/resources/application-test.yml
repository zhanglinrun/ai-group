server:
  port: 8080

# 应用配置
app:
  config:
    # 版本，方便通过接口版本升级
    api-version: v1
    # 跨域，开发阶段可以设置为 * 不限制
    cross-origin: '*'
    # SC 渠道配置 - 拼团对接渠道值、回调通知
    group-service:
      api-url: http://127.0.0.1:8091
      notify-url: http://127.0.0.1:8080/api/pay/group/notify
      source: s01
      chanel: c01

# 线程池配置
thread:
  pool:
    executor:
      config:
        core-pool-size: 20
        max-pool-size: 50
        keep-alive-time: 5000
        block-queue-size: 5000
        policy: CallerRunsPolicy

# 数据库配置；启动时配置数据库资源信息
spring:
  datasource:
    username: root
    password: 123456
    url: jdbc:mysql://127.0.0.1:13306/s_pay_mall_ddd_market?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=Asia/Shanghai&useSSL=true
    driver-class-name: com.mysql.cj.jdbc.Driver
  hikari:
    pool-name: Retail_HikariCP
    minimum-idle: 15 #最小空闲连接数量
    idle-timeout: 180000 #空闲连接存活最大时间，默认600000（10分钟）
    maximum-pool-size: 25 #连接池最大连接数，默认是10
    auto-commit: true  #此属性控制从池返回的连接的默认自动提交行为,默认值：true
    max-lifetime: 1800000 #此属性控制池中连接的最长生命周期，值0表示无限生命周期，默认1800000即30分钟
    connection-timeout: 30000 #数据库连接超时时间,默认30秒，即30000
    connection-test-query: SELECT 1
  type: com.zaxxer.hikari.HikariDataSource
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: xiongdoctor
    password: xiongdoctor_dev
    publisher-confirm-type: correlated
    publisher-returns: true
    event-exchange: xiongdoctor.events
    confirm-timeout-ms: 1000

# MyBatis 配置【如需使用记得打开】
mybatis:
  mapper-locations: classpath:/mybatis/mapper/*.xml
  config-location:  classpath:/mybatis/config/mybatis-config.xml

# 支付宝支付 - 沙箱 https://opendocs.alipay.com/common/02kkv7（密钥统一从环境变量注入，勿硬编码）
alipay:
  enabled: ${ALIPAY_ENABLED:false}
  app_id: ${ALIPAY_APP_ID:}
  merchant_private_key: ${ALIPAY_MERCHANT_PRIVATE_KEY:}
  alipay_public_key: ${ALIPAY_PUBLIC_KEY:}
  notify_url: ${ALIPAY_NOTIFY_URL:http://127.0.0.1:8080/api/pay/alipay/notify}
  return_url: ${ALIPAY_RETURN_URL:http://127.0.0.1:5173/pricing?tab=orders&paymentReturn=1}
  gatewayUrl: ${ALIPAY_GATEWAY_URL:https://openapi-sandbox.dl.alipaydev.com/gateway.do}

# SC 渠道配置 - 拼团对接渠道值
sc:
  group:
    buy:
      market:
        source: s01
        chanel: c01

# 日志
logging:
  level:
    root: info
  config: classpath:logback-spring.xml

ai-group:
  identity:
    signing-secret: unit-test-identity-signing-secret!
  internal:
    token: test-internal-token

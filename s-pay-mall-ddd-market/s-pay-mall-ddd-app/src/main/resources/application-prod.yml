server:
  port: 8070

app:
  config:
    api-version: v1
    cross-origin: ${APP_CROSS_ORIGIN:https://your-frontend.example.com}
    group-buy-market:
      api-url: ${GROUP_BUY_API_URL:}
      notify-url: ${GROUP_BUY_NOTIFY_URL:http://127.0.0.1:8070/api/v1/alipay/group_buy_notify}
      source: ${GROUP_BUY_SOURCE:s01}
      chanel: ${GROUP_BUY_CHANNEL:c01}
    member-service:
      api-url: ${MEMBER_SERVICE_URL:}

thread:
  pool:
    executor:
      config:
        core-pool-size: 20
        max-pool-size: 50
        keep-alive-time: 5000
        block-queue-size: 5000
        policy: CallerRunsPolicy

spring:
  datasource:
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    url: ${MYSQL_URL}
    driver-class-name: com.mysql.cj.jdbc.Driver
  hikari:
    pool-name: Retail_HikariCP
    minimum-idle: 15
    idle-timeout: 180000
    maximum-pool-size: 25
    auto-commit: true
    max-lifetime: 1800000
    connection-timeout: 30000
    connection-test-query: SELECT 1
  type: com.zaxxer.hikari.HikariDataSource

mybatis:
  mapper-locations: classpath:/mybatis/mapper/*.xml
  config-location: classpath:/mybatis/config/mybatis-config.xml

weixin:
  enabled: false

alipay:
  enabled: ${ALIPAY_ENABLED:false}
  app_id: ${ALIPAY_APP_ID}
  merchant_private_key: ${ALIPAY_MERCHANT_PRIVATE_KEY}
  alipay_public_key: ${ALIPAY_PUBLIC_KEY}
  notify_url: ${ALIPAY_NOTIFY_URL}
  return_url: ${ALIPAY_RETURN_URL}
  gatewayUrl: ${ALIPAY_GATEWAY_URL:https://openapi.alipay.com/gateway.do}

sc:
  group:
    buy:
      market:
        source: ${GROUP_BUY_SOURCE:s01}
        chanel: ${GROUP_BUY_CHANNEL:c01}

logging:
  level:
    root: info
  config: classpath:logback-spring.xml

ai-group:
  pay:
    catalog:
      fallback-enabled: false
      products:
        "9890002":
          name: ${PAY_QUOTA_LIGHT_NAME:轻量额度包（60）}
          price: ${PAY_QUOTA_LIGHT_PRICE:12.00}
          product-code: QUOTA_LIGHT
          base-quota: 60
        "9890003":
          name: ${PAY_QUOTA_STANDARD_NAME:标准额度包（300）}
          price: ${PAY_QUOTA_STANDARD_PRICE:60.00}
          product-code: QUOTA_STANDARD
          base-quota: 300
        "9890004":
          name: ${PAY_QUOTA_LARGE_NAME:大额额度包（700）}
          price: ${PAY_QUOTA_LARGE_PRICE:140.00}
          product-code: QUOTA_LARGE
          base-quota: 700
  internal:
    token: ${AI_GROUP_INTERNAL_TOKEN}

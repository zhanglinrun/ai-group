spring:
  config:
    name: s-pay-mall-ddd-app
  profiles:
    active: dev
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 10000
    consumer:
      group-id: s-pay-mall-ddd
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "*"
    config:
      producer:
        confirm-timeout-ms: ${KAFKA_PUBLISH_CONFIRM_TIMEOUT_MS:5000}
        topic_order_pay_success:
          topic: pay.order_pay_success
        member_benefit:
          topic: member.benefit.completed
      consumer:
        group-id: s-pay-mall-ddd
        topic_team_success:
          topic: group.team_success
        topic_team_refund:
          topic: group.team_refund
        topic_order_pay_success:
          topic: pay.order_pay_success


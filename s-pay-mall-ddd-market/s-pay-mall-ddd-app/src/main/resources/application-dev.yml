server:
  port: 8070

# 应用配置
app:
  config:
    # 版本，方便通过接口版本升级
    api-version: v1
    # 跨域，开发阶段可以设置为 * 不限制
    cross-origin: '*'
    # SC 渠道配置 - 拼团对接渠道值、回调通知
    group-buy-market:
      api-url: http://127.0.0.1:8091
      notify-url: http://127.0.0.1:8070/api/v1/alipay/group_buy_notify
      source: s01
      chanel: c01

# 线程池配置
thread:
  pool:
    executor:
      config:
        core-pool-size: 20
        max-pool-size: 50
        keep-alive-time: 5000
        block-queue-size: 5000
        policy: CallerRunsPolicy

# 数据库配置；启动时配置数据库资源信息
spring:
  datasource:
    username: root
    password: 123456
    url: jdbc:mysql://127.0.0.1:13306/s_pay_mall_ddd_market?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
  hikari:
    pool-name: Retail_HikariCP
    minimum-idle: 15 #最小空闲连接数量
    idle-timeout: 180000 #空闲连接存活最大时间，默认600000（10分钟）
    maximum-pool-size: 25 #连接池最大连接数，默认是10
    auto-commit: true  #此属性控制从池返回的连接的默认自动提交行为,默认值：true
    max-lifetime: 1800000 #此属性控制池中连接的最长生命周期，值0表示无限生命周期，默认1800000即30分钟
    connection-timeout: 30000 #数据库连接超时时间,默认30秒，即30000
    connection-test-query: SELECT 1
  type: com.zaxxer.hikari.HikariDataSource
  # RabbitMQ
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: admin
    password: admin
    listener:
      simple:
        prefetch: 1 # 每次投递n个消息，消费完在投递n个
        acknowledge-mode: auto
        # C5: bounded retry, then reject WITHOUT requeue so the broker dead-letters
        # the message instead of redelivering a poison message forever.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 4
          initial-interval: 1000
          multiplier: 2
          max-interval: 10000
    template:
      delivery-mode: persistent # 确保全局默认设置为持久化（可选）
    # 消息配置
    config:
      # 生产者
      producer:
        # 主题配置
        topic_order_pay_success:
          # 绑定交换机
          exchange: s_pay_mall_exchange
          # 消费主题
          routing_key: topic.order_pay_success
          # 消费队列
          queue: s_pay_mall_queue_2_order_pay_success
        member_benefit:
          exchange: member.benefit.exchange
          routing_key: member.benefit.completed
      consumer:
        # C5: dead-letter exchange; consumer queues route rejected messages here
        # (declared in RabbitMQDlqConfig). NOTE: pre-existing queues without the
        # x-dead-letter arguments must be deleted once locally, see RabbitMQDlqConfig.
        dlx_exchange: s_pay_mall_dlx
        # 主题配置 topic 主题，team_success
        topic_team_success:
          # 绑定交换机 - 消息提供者的交换机
          exchange: group_buy_market_exchange
          # 消息主题
          routing_key: topic.team_success
          # 消费队列 - 每个系统有自己的消费队列
          queue: s_pay_mall_queue_2_topic_team_success
          # dead-letter queue + routing key (declared in RabbitMQDlqConfig)
          dlq: s_pay_mall_queue_2_topic_team_success_dlq
          dlq_routing_key: topic.team_success.dlq
        topic_team_refund:
          # 绑定交换机 - 消息提供者的交换机
          exchange: group_buy_market_exchange
          # 消息主题
          routing_key: topic.team_refund
          # 消费队列
          queue: s_pay_mall_queue_2_topic_team_refund
          # dead-letter queue + routing key (declared in RabbitMQDlqConfig)
          dlq: s_pay_mall_queue_2_topic_team_refund_dlq
          dlq_routing_key: topic.team_refund.dlq
        # 主题配置
        topic_order_pay_success:
          # 绑定交换机
          exchange: s_pay_mall_exchange
          # 消费主题
          routing_key: topic.order_pay_success
          # 消费队列
          queue: s_pay_mall_queue_2_order_pay_success
          # dead-letter queue + routing key (declared in RabbitMQDlqConfig)
          dlq: s_pay_mall_queue_2_order_pay_success_dlq
          dlq_routing_key: topic.order_pay_success.dlq

# MyBatis 配置【如需使用记得打开】
mybatis:
  mapper-locations: classpath:/mybatis/mapper/*.xml
  config-location:  classpath:/mybatis/config/mybatis-config.xml

# 微信公众号对接（已禁用，统一走 auth-service + 支付宝）
weixin:
  enabled: false
  config:
    originalid: ${WEIXIN_ORIGINAL_ID:}
    token: ${WEIXIN_TOKEN:}
    app-id: ${WEIXIN_APP_ID:}
    app-secret: ${WEIXIN_APP_SECRET:}
    template_id: ${WEIXIN_TEMPLATE_ID:}

# 支付宝支付 - 沙箱；密钥从根目录 .env 注入（start-full-stack.ps1 会设置环境变量）
alipay:
  enabled: ${ALIPAY_ENABLED:true}
  strict: ${ALIPAY_STRICT:false}
  app_id: ${ALIPAY_APP_ID:9021000163648430}
  merchant_private_key: ${ALIPAY_MERCHANT_PRIVATE_KEY:}
  alipay_public_key: ${ALIPAY_PUBLIC_KEY:}
  notify_url: ${ALIPAY_NOTIFY_URL:http://127.0.0.1:8080/api/v1/alipay/alipay_notify_url}
  return_url: ${ALIPAY_RETURN_URL:http://127.0.0.1:5173/pricing?tab=orders&paymentReturn=1}
  gatewayUrl: ${ALIPAY_GATEWAY_URL:https://openapi-sandbox.dl.alipaydev.com/gateway.do}

# SC 渠道配置 - 拼团对接渠道值
sc:
  group:
    buy:
      market:
        source: s01
        chanel: c01

# 日志
logging:
  level:
    root: info
  config: classpath:logback-spring.xml

ai-group:
  internal:
    token: ${AI_GROUP_INTERNAL_TOKEN:ai-group-dev-internal-token-change-in-prod}
  pay:
    # 小额实收开关：>0 时实际向支付宝只收该金额（真实支付通道演示用）；<=0 按套餐价全额收取。
    # 当前走支付宝沙箱（假钱），默认全额收取使收银台金额与页面价格一致；
    # 若切换到真实支付通道又只想花几分钱演示，设 AI_GROUP_PAY_SANDBOX_AMOUNT=0.01 即可。
    sandbox-amount: ${AI_GROUP_PAY_SANDBOX_AMOUNT:0}
    # 商品目录（goodsId -> 名称/展示价），与 member_db.product_sku、group_buy_market.sku 对齐
    catalog:
      products:
        "9890001":
          name: "《手写MyBatis：渐进式源码实践》"
          price: 100.00
        "9890002":
          name: "Pro 月卡"
          price: 49.00
        "9890003":
          name: "Pro 年卡"
          price: 399.00
        "9890004":
          name: "额度加油包"
          price: 29.00
    goods-sku-bindings:
      # legacy 演示商品（历史订单引用）
      "9890001":
        - "PRO_MONTH"
        - "PRO_YEAR"
        - "TOPUP_200"
      # 每 SKU 独立拼团商品（与 member_db.product_sku.group_goods_id 对齐）
      "9890002":
        - "PRO_MONTH"
      "9890003":
        - "PRO_YEAR"
      "9890004":
        - "TOPUP_200"
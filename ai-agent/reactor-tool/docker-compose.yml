services:
  reactor-tool:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-group/reactor-tool:local
    ports:
      - "127.0.0.1:1601:1601"
    env_file:
      - path: .env
        required: false
    environment:
      REACTOR_TOOL_ENV: prod
      REACTOR_TOOL_HOST: 0.0.0.0
      REACTOR_TOOL_WORKERS: 1
      AI_GROUP_INTERNAL_TOKEN: ${AI_GROUP_INTERNAL_TOKEN:?set AI_GROUP_INTERNAL_TOKEN}
      SKILL_ALLOWED_RUNTIMES: python
      SKILL_WORKSPACE_ROOT: /workspaces
      FILE_SAVE_PATH: /data/files
      SQLITE_DB_PATH: /data/autobots.db
      LOG_PATH: /data/server.log
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/cache
      MPLCONFIGDIR: /tmp/matplotlib
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
      - /workspaces:size=1g,mode=0700,uid=10001,gid=10001
    volumes:
      - reactor-tool-data:/data
      # 容器化 Skill 执行时，Java 侧传入的 skillBasePath 也必须使用该容器路径。
      - ../runtime/skills:/skills:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:1601/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  reactor-tool-data:

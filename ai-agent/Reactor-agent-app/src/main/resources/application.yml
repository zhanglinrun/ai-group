server:
  port: 8090

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

spring:
  application:
    name: agent
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  cloud:
    compatibility-verifier:
      enabled: false
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848}
        namespace: public
  ai:
    openai:
      api-key: ${AGENT_GROUP_LLM_API_KEY:${DASHSCOPE_API_KEY:${OPENAI_API_KEY:}}}
      base-url: ${AGENT_GROUP_LLM_BASE_URL:${OPENAI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}}
      chat:
        options:
          model: ${AGENT_GROUP_LLM_CHAT_MODEL:qwen-plus}
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration

jwt:
  secret: ${JWT_SECRET:change-me-to-a-long-random-secret}

ai-agent:
  debug-endpoints:
    enabled: false
  checkpoint:
    enabled: ${AGENT_CHECKPOINT_ENABLED:true}
    max-messages-per-agent: ${AGENT_CHECKPOINT_MAX_MESSAGES:40}
    max-message-chars: ${AGENT_CHECKPOINT_MAX_MESSAGE_CHARS:4000}
    replay-safe-tools:
      - deep_search
      - web_fetch
      - read_tool
      - list_directory_tool
      - grep_tool
      - glob_tool

ai-group:
  member-service:
    base-url: ${AI_GROUP_MEMBER_URL:http://127.0.0.1:8082}
  internal:
    token: ${AI_GROUP_INTERNAL_TOKEN:change-me-to-a-long-random-internal-token}

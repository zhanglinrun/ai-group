spring:
  application:
    name: member-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:13306}/member_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_ROOT_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:xiongdoctor}
    password: ${RABBITMQ_PASSWORD:xiongdoctor_dev}
    publisher-confirm-type: correlated
    publisher-returns: true
    event-exchange: ${RABBITMQ_EVENT_EXCHANGE:xiongdoctor.events}
    routing:
      member-benefit: ${RABBITMQ_MEMBER_BENEFIT:member.benefit.completed}
      member-user-registered: ${RABBITMQ_MEMBER_USER_REGISTERED:auth.user_registered}
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: true
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
          max-interval: 10000ms
          multiplier: 2.0
  cloud:
    compatibility-verifier:
      enabled: false
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:16379}
      password: ${REDIS_PASSWORD:}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

server:
  port: ${SERVER_PORT:18082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized

ai-group:
  internal:
    token: ${AI_GROUP_INTERNAL_TOKEN:}

# XXL-JOB 执行器配置
xxl:
  job:
    enabled: ${XXL_JOB_ENABLED:true}
    admin:
      addresses: ${XXL_JOB_ADMIN_ADDRESSES:http://127.0.0.1:18081/xxl-job-admin}
    accessToken: ${XXL_JOB_ACCESS_TOKEN:default_token}
    executor:
      logpath: ${XXL_JOB_LOGPATH:./logs/xxl-job/member}
      logretentiondays: 30

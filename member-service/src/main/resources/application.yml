spring:
  application:
    name: member
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:13306}/member_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_ROOT_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:admin}
    password: ${RABBITMQ_PASSWORD:admin}
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 4
          initial-interval: 2000ms
          multiplier: 2
          max-interval: 20000ms
  cloud:
    compatibility-verifier:
      enabled: false
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

# member 不校验 JWT（信任网关注入的身份头），但 common 模块的 JwtUtils 被扫描实例化，
# 其 @PostConstruct 要求 secret 非空；提供 dev 默认值以便本服务可独立启动。
jwt:
  secret: ${JWT_SECRET:ai-group-dev-jwt-secret-2026-k8m3p9x2v7n4q1w6-change-in-prod}

server:
  port: 8082

ai-group:
  member:
    benefit-queue: member.benefit.queue
    benefit-exchange: member.benefit.exchange
    benefit-routing-key: member.benefit.completed
    monthly-grant-cron: "0 0 1 * * ?"
    ability-cost:
      multipliers:
        react: 1
        workflow: 1
        plan_solve: 3
        image_generation: 5
        deep_search: 4
  internal:
    token: ${AI_GROUP_INTERNAL_TOKEN:ai-group-dev-internal-token-change-in-prod}
